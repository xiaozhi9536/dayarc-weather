function parseCwaIcon(wxCode, isDay) {
  const code = parseInt(wxCode, 10);
  if (code === 1) return isDay ? Sun : Moon;
  if (code >= 2 && code <= 3) return isDay ? CloudSun : CloudMoon;
  if (code >= 4 && code <= 7) return Cloud;
  if (code >= 8 && code <= 14) return CloudRain;
  if (code >= 15 && code <= 18) return CloudLightning;
  if (code >= 19) return CloudRain;
  return Cloud;
}

/* ==========================================
 * UI 組件：日月弧線軌跡 (SkyArc)
 * ========================================== */
function SkyArc({ hour, minute, theme, h, r }) {
  const sunriseHour = 6, sunsetHour = 18;
  const isDay = hour + minute / 60 >= sunriseHour && hour + minute / 60 < sunsetHour;
  const w = 300, cx = 150, cy = h - (130 - 118);
  let progress;
  if (isDay) progress = (hour + minute / 60 - sunriseHour) / (sunsetHour - sunriseHour);
  else {
    const nightLen = 24 - (sunsetHour - sunriseHour);
    const t = (hour + minute / 60 - sunsetHour + 24) % 24;
    progress = t / nightLen;
  }
  progress = Math.min(Math.max(progress, 0), 1);
  const theta = (180 - 180 * progress) * Math.PI / 180;
  const mx = cx + r * Math.cos(theta), my = cy - r * Math.sin(theta);

  return React.createElement("svg", { width: "100%", viewBox: `0 0 ${w} ${h}`, style: { display: "block", overflow: "visible" } },
    React.createElement("path", { d: `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`, fill: "none", stroke: theme.sub, strokeOpacity: "0.35", strokeWidth: "1.5", strokeDasharray: "3 6", strokeLinecap: "round" }),
    React.createElement("line", { x1: cx - r - 10, y1: cy, x2: cx + r + 10, y2: cy, stroke: theme.sub, strokeOpacity: "0.25", strokeWidth: "1" }),
    React.createElement("circle", { cx: mx, cy: my, r: r * 0.09, fill: theme.accent }),
    React.createElement("circle", { cx: mx, cy: my, r: r * 0.16, fill: theme.accent, opacity: "0.22" })
  );
}

function useViewport() {

  useEffect(() => {
    let raf;
    const onResize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setSize({ w: window.innerWidth, h: window.innerHeight })); };
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => { window.removeEventListener("resize", onResize); window.removeEventListener("orientationchange", onResize); cancelAnimationFrame(raf); };
  }, []);
  return size;
}

/* ==========================================
 * 主組件 WeatherClock
 * ========================================== */
function WeatherClock() {
  const [now, setNow] = useState(new Date());
  const { w: vw, h: vh } = useViewport();
  const [status, setStatus] = useState("locating");
  const [place, setPlace] = useState("");
  const [coordsText, setCoordsText] = useState("");
  const [weatherData, setWeatherData] = useState({ current: null, daily: [] });
  const [aqi, setAqi] = useState(null);
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [sourceMsg, setSourceMsg] = useState("Open-Meteo");
  const [lastUpdate, setLastUpdate] = useState("");

  const lastGoodLoc = useRef(null);

  // 獨立：大時鐘每一秒更新
  useEffect(() => {
    const clockTimer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(clockTimer);
  }, []);

  const loadWeather = useCallback(async (lat, lon, customPlaceName = null) => {
    try {
      setStatus(prev => prev === "ready" ? "ready" : "locating");
      
      let geocodeData = {};
      if (!customPlaceName) {
        const gRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
        if (gRes.ok) geocodeData = await gRes.json();
      }

      const isTaiwan = customPlaceName ? customPlaceName.includes("台灣") || customPlaceName.includes("臺") || customPlaceName.includes("國中") || customPlaceName.includes("科大") : (geocodeData.countryCode === "TW");
      const finalPlaceName = customPlaceName || [geocodeData.city || geocodeData.principalSubdivision, geocodeData.locality].filter(Boolean).join(" · ");

      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`)
        .then(res => res.json()).then(data => setAqi(data.current?.us_aqi || null)).catch(() => setAqi(null));

      let finalParsedData = null;
      let finalSource = "Open-Meteo";

      const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weathercode,is_day&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);
      const wData = await wRes.json();
      const WMO_TEXT = { 0: "晴朗", 1: "晴時多雲", 2: "多雲", 3: "陰天", 45: "有霧", 48: "霧淞", 51: "毛毛雨", 61: "小雨", 63: "中雨", 65: "大雨", 71: "小雪", 80: "短暫陣雨", 81: "短暫陣雨", 82: "強陣雨", 95: "雷雨", 96: "雷雨" };
      
      finalParsedData = {
        current: {
          temp: Math.round(wData.current.temperature_2m),
          apparentTemp: Math.round(wData.current.apparent_temperature),
          rh: Math.round(wData.current.relative_humidity_2m),
          windSpeed: wData.current.wind_speed_10m,
          wxText: WMO_TEXT[wData.current.weathercode] || "未知",
          wxCode: wData.current.weathercode,
          rain: wData.daily.precipitation_probability_max[0] || 0,
          isCwa: false
        },
        daily: wData.daily.time.map((d, i) => {
          const dt = new Date(d + "T00:00:00");
          return {
            date: `${dt.getMonth()+1}/${dt.getDate()}`,
            weekday: dt.toLocaleDateString("zh-TW", { weekday: "short" }),
            wxText: WMO_TEXT[wData.daily.weathercode[i]] || "—",
            code: wData.daily.weathercode[i],
            hi: Math.round(wData.daily.temperature_2m_max[i]),
            lo: Math.round(wData.daily.temperature_2m_min[i]),
            rain: wData.daily.precipitation_probability_max[i] || 0,
            isToday: i === 0,
            isCwa: false
          };
        })
      };

      if (isTaiwan && CWA_API_KEY) {
        try {
          let cwaCity = geocodeData.city || geocodeData.principalSubdivision || (customPlaceName ? customPlaceName.split("·")[0]?.trim() : "臺北市");
          if (customPlaceName === "南台科大") cwaCity = "臺南市";
          if (customPlaceName === "桃園平鎮國中") cwaCity = "桃園市";

          const formalCity = cwaCity.replace("台", "臺"); 
          const cwaRes = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${CWA_API_KEY}&locationName=${formalCity}`);
          const cwaData = await cwaRes.json();
          
          if (cwaData.success === "true" && cwaData.records.location.length > 0) {
             const loc = cwaData.records.location[0];
             const getVal = (elName, timeIdx) => loc.weatherElement.find(e => e.elementName === elName).time[timeIdx].parameter;
             
             const currentWx = getVal("Wx", 0);
             const currentT = getVal("MinT", 0);
             const currentPoP = getVal("PoP", 0);

             finalParsedData.current.temp = currentT.parameterName;
             finalParsedData.current.apparentTemp = parseInt(currentT.parameterName) + 2; 
             finalParsedData.current.wxText = currentWx.parameterName;
             finalParsedData.current.wxCode = currentWx.parameterValue;
             finalParsedData.current.rain = currentPoP.parameterName;
             finalParsedData.current.isCwa = true;

             for(let i=0; i<3; i++) {
                 if(i >= finalParsedData.daily.length) break;
                 const dayWx = getVal("Wx", i);
                 const dayPop = getVal("PoP", i);
                 finalParsedData.daily[i].rain = dayPop.parameterName;
                 finalParsedData.daily[i].isCwa = true;
                 finalParsedData.daily[i].wxText = dayWx.parameterName;
                 finalParsedData.daily[i].code = dayWx.parameterValue;
             }

             finalSource = "CWA (即時) + Open-Meteo (一週)";
          }
        } catch (e) {
           console.warn("CWA 抓取覆寫失敗，維持全 Open-Meteo 資料", e);
        }
      }

      setCoordsText(`${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`);
