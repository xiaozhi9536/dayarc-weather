/* ==========================================
 * CWA 與 WMO 天氣代碼對應
 * ========================================== */
function parseCwaIcon(wxCode, isDay) {
  const code = parseInt(wxCode, 10);
  if (code === 1) return isDay ? Sun : Moon;
  if (code >= 2 && code <= 3) return isDay ? CloudSun : CloudMoon;
  if (code >= 4 && code <= 7) return Cloud;
  if (code >= 8 && code <= 14) return CloudRain;
  if (code >= 15 && code <= 18) return CloudLightning;
  if (code >= 19) return CloudRain;
  return Cloud;
}

function getTheme(hour) {
  if (hour >= 5 && hour < 8) return { name: "晨", from: "#FFC896", to: "#FFE8D6", accent: "#C6572E", text: "#4A2E1E", sub: "#8A5A3C", card: "rgba(255,255,255,0.55)" };
  if (hour >= 8 && hour < 17) return { name: "日", from: "#6BB9E8", to: "#DFF3FF", accent: "#1D6FA5", text: "#173247", sub: "#3E6883", card: "rgba(255,255,255,0.55)" };
  if (hour >= 17 && hour < 19) return { name: "昏", from: "#FF9166", to: "#4A3B6B", accent: "#FF6F3C", text: "#FFF3EA", sub: "#F2C9B5", card: "rgba(255,255,255,0.14)" };
  return { name: "夜", from: "#141A38", to: "#33396E", accent: "#93A3FF", text: "#EDEFFF", sub: "#A6ADD9", card: "rgba(255,255,255,0.08)" };
}

function getSizes(tier, short) {
  const table = {

    md: { clock: 50, arcH: short ? 92 : 150, arcR: short ? 70 : 118, weekIcon: 26, todayIcon: 42, todayTemp: 28, cardPad: "20px 22px", weekMin: 94 },
    lg: { clock: 60, arcH: short ? 100 : 170, arcR: short ? 78 : 136, weekIcon: 30, todayIcon: 48, todayTemp: 32, cardPad: "24px 26px", weekMin: 104 }
  };
  return table[tier];
}

/* ==========================================
 * 日月弧線軌跡組件
 * ========================================== */
function SkyArc({ hour, minute, theme, h, r }) {
  const sunriseHour = 6, sunsetHour = 18;
  const isDay = hour + minute / 60 >= sunriseHour && hour + minute / 60 < sunsetHour;
  const w = 300, cx = 150, cy = h - (130 - 118);
  let progress;
  if (isDay) progress = (hour + minute / 60 - sunriseHour) / (sunsetHour - sunriseHour);
  else {
    const nightLen = 24 - (sunsetHour - sunriseHour);
    const t = (hour + minute / 60 - sunsetHour + 24) % 24;
    progress = t / nightLen;
  }
  progress = Math.min(Math.max(progress, 0), 1);
  const theta = (180 - 180 * progress) * Math.PI / 180;
  const mx = cx + r * Math.cos(theta), my = cy - r * Math.sin(theta);

  return React.createElement("svg", { width: "100%", viewBox: `0 0 ${w} ${h}`, style: { display: "block", overflow: "visible" } },
    React.createElement("path", { d: `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`, fill: "none", stroke: theme.sub, strokeOpacity: "0.35", strokeWidth: "1.5", strokeDasharray: "3 6", strokeLinecap: "round" }),
    React.createElement("line", { x1: cx - r - 10, y1: cy, x2: cx + r + 10, y2: cy, stroke: theme.sub, strokeOpacity: "0.25", strokeWidth: "1" }),

    React.createElement("circle", { cx: mx, cy: my, r: r * 0.16, fill: theme.accent, opacity: "0.22" })
  );
}

function useViewport() {
  const [size, setSize] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    let raf;
    const onResize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setSize({ w: window.innerWidth, h: window.innerHeight })); };
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => { window.removeEventListener("resize", onResize); window.removeEventListener("orientationchange", onResize); cancelAnimationFrame(raf); };
  }, []);
  return size;
}

 * 主組件 WeatherClock
 * ========================================== */
function WeatherClock() {
  const [now, setNow] = useState(new Date());
  const { w: vw, h: vh } = useViewport();
  const [status, setStatus] = useState("locating");
  const [place, setPlace] = useState("");
  const [coordsText, setCoordsText] = useState("");
  const [weatherData, setWeatherData] = useState({ current: null, daily: [] });
  const [aqi, setAqi] = useState(null);
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [sourceMsg, setSourceMsg] = useState("Open-Meteo");

  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);

  // 統一處理並載入天氣
  const loadWeather = useCallback(async (lat, lon, customPlaceName = null) => {
    try {
      setStatus("locating");
      setCoordsText(`${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`);
      
      // 1. 取得地名資訊
      let geocodeData = {};
      if (!customPlaceName) {
        const gRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
        if (gRes.ok) geocodeData = await gRes.json();
      }

      const isTaiwan = customPlaceName ? customPlaceName.includes("台灣") || customPlaceName.includes("臺") : (geocodeData.countryCode === "TW");
      const finalPlaceName = customPlaceName || [geocodeData.city || geocodeData.principalSubdivision, geocodeData.locality].filter(Boolean).join(" · ");
      setPlace(finalPlaceName || "目前位置");

      // 取得 AQI
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`)
        .then(res => res.json()).then(data => setAqi(data.current?.us_aqi || null)).catch(() => setAqi(null));

      // 2. 判斷是否使用中央氣象署 (CWA)
      if (isTaiwan && CWA_API_KEY) {
        try {
          const cwaCity = geocodeData.city || geocodeData.principalSubdivision || (customPlaceName ? customPlaceName.split("·")[0]?.trim() : "臺北市");
          const formalCity = cwaCity.replace("台", "臺"); 
          
          const cwaRes = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${CWA_API_KEY}&locationName=${formalCity}`);
          const cwaData = await cwaRes.json();
          
          if (cwaData.success === "true" && cwaData.records.location.length > 0) {
             const loc = cwaData.records.location[0];
             const getVal = (elName, timeIdx) => loc.weatherElement.find(e => e.elementName === elName).time[timeIdx].parameter;
             
             const currentWx = getVal("Wx", 0);
             const currentT = getVal("MinT", 0);
             const currentPoP = getVal("PoP", 0);

             const parsedData = {
               current: {
                 temp: currentT.parameterName,
                 apparentTemp: parseInt(currentT.parameterName) + 2,
                 rh: 75,
                 windSpeed: 5,
                 wxText: currentWx.parameterName,
                 wxCode: currentWx.parameterValue,
                 rain: currentPoP.parameterName,
                 isCwa: true
               },
               daily: []
             };

             for(let i=0; i<3; i++) {
                const wx = getVal("Wx", i);
                const pop = getVal("PoP", i);
                const minT = getVal("MinT", i);
                const maxT = getVal("MaxT", i);
                const timeStr = loc.weatherElement[0].time[i].startTime;
                const dt = new Date(timeStr);
                parsedData.daily.push({
                   date: `${dt.getMonth()+1}/${dt.getDate()}`,
                   weekday: dt.toLocaleDateString("zh-TW", { weekday: "short" }),
                   wxText: wx.parameterName,
                   code: wx.parameterValue,
                   hi: maxT.parameterName,
                   lo: minT.parameterName,
                   rain: pop.parameterName,
                   isToday: i === 0,
                   isCwa: true
                });
             }
             
             setWeatherData(parsedData);
             setSourceMsg("中央氣象署 (CWA)");
             setStatus("ready");
             return;
          }
        } catch (e) {
           console.warn("CWA 抓取失敗，退回 Open-Meteo", e);
        }
      }

      // 3. Fallback: 使用 Open-Meteo
      const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weathercode,is_day&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);
      const wData = await wRes.json();
      
      const WMO_TEXT = { 0: "晴朗", 1: "晴時多雲", 2: "多雲", 3: "陰天", 45: "有霧", 48: "霧淞", 51: "毛毛雨", 61: "小雨", 63: "中雨", 65: "大雨", 71: "小雪", 80: "短暫陣雨", 81: "短暫陣雨", 82: "強陣雨", 95: "雷雨", 96: "雷雨" };
      
      const parsedData = {
        current: {
          temp: Math.round(wData.current.temperature_2m),
          apparentTemp: Math.round(wData.current.apparent_temperature),
          rh: Math.round(wData.current.relative_humidity_2m),
          windSpeed: wData.current.wind_speed_10m,
          wxText: WMO_TEXT[wData.current.weathercode] || "未知",
          wxCode: wData.current.weathercode,
          rain: wData.daily.precipitation_probability_max[0] || 0,
          isCwa: false
        },
        daily: wData.daily.time.map((d, i) => {
          const dt = new Date(d + "T00:00:00");
          return {
            date: `${dt.getMonth()+1}/${dt.getDate()}`,
            weekday: dt.toLocaleDateString("zh-TW", { weekday: "short" }),
            wxText: WMO_TEXT[wData.daily.weathercode[i]] || "—",
            code: wData.daily.weathercode[i],
            hi: Math.round(wData.daily.temperature_2m_max[i]),
            lo: Math.round(wData.daily.temperature_2m_min[i]),
            rain: wData.daily.precipitation_probability_max[i] || 0,
            isToday: i === 0,
            isCwa: false
          };
        })
      };
      
      setWeatherData(parsedData);
      setSourceMsg("Open-Meteo");
      setStatus("ready");

    } catch (e) {
      console.error(e);
      setStatus("error");
    }
  }, []);

  const requestLocation = useCallback(() => {
    setStatus("locating");
    if (!navigator.geolocation) return setStatus("error");
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => setStatus("denied"),
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 5 * 60 * 1000 }
    );
  }, [loadWeather]);

  useEffect(() => { requestLocation(); }, [requestLocation]);

  const hour = now.getHours(), minute = now.getMinutes();
  const theme = useMemo(() => getTheme(hour), [hour]);
  const timeStr = now.toLocaleTimeString("zh-TW", { hour12: false });
  const dateStr = now.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric" });
  const weekdayStr = now.toLocaleDateString("zh-TW", { weekday: "long" });

  const tier = vw < 600 ? "sm" : vw < 1024 ? "md" : "lg";
  const short = vh < 520;
  const twoColumn = vw >= 600;
  const sizes = getSizes(tier, short);
  const curWx = weatherData.current;
  
  const getIconComp = (code, isCwa, isDay) => {
      if(isCwa) return parseCwaIcon(code, isDay);
      if (code === 0) return isDay ? Sun : Moon;
      if (code === 1 || code === 2) return isDay ? CloudSun : CloudMoon;
      if (code === 3) return Cloud;
      if (code >= 80 && code <= 82) return CloudRain;
      if (code >= 95) return CloudLightning;
      return Cloud;
  }

  return React.createElement("div", {
    style: {
      height: short ? "100vh" : "auto", minHeight: "100vh", width: "100%", overflow: short ? "hidden" : "auto",
      background: `linear-gradient(160deg, ${theme.from} 0%, ${theme.to} 100%)`, color: theme.text,
      transition: "background 1.2s ease, color 1.2s ease", display: "flex", justifyContent: "center", boxSizing: "border-box"
    }
  },
    React.createElement("div", { className: "shell-pad", style: { padding: tier === "lg" ? "40px" : tier === "md" ? "20px 28px" : "22px 16px 26px" } },
      React.createElement("div", {
        className: "grid-wrap",
        style: {
          maxWidth: tier === "lg" ? 980 : tier === "md" ? 720 : 440,
          gridTemplateColumns: twoColumn ? tier === "lg" ? "300px 1fr" : "240px 1fr" : "1fr",
          /* 修正2：明確為 footer 指定橫跨區塊，確保底部文字不會亂跑 */
          gridTemplateAreas: twoColumn 
            ? '"header header" "clock today" "sky today" "week week" "footer footer"' 
            : '"header" "clock" "sky" "today" "week" "footer"',
          columnGap: twoColumn ? tier === "lg" ? 40 : 24 : 0, rowGap: twoColumn ? 10 : 14,
          alignContent: twoColumn ? "center" : "start", height: twoColumn && short ? "100%" : "auto"
        }
      },
        React.createElement("div", { className: "area-header", style: { display: "flex", alignItems: "center", gap: 6, opacity: 0.9, fontSize: tier === "lg" ? 15 : 13 } },
          React.createElement(MapPin, { size: 15 }),
          React.createElement("div", { style: { display: "flex", flexDirection: "column" } },
            React.createElement("span", { style: { fontWeight: "500" } }, place || (status === "locating" ? "定位中…" : status === "denied" ? "未取得權限" : "無法取得天氣")),
            coordsText && React.createElement("span", { style: { fontSize: 10, opacity: 0.75 } }, `定位點: ${coordsText}`)
          ),
          React.createElement("button", {
            onClick: () => setIsModalOpen(true),
            style: { marginLeft: 8, display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: theme.accent, background: theme.card, border: `1px solid ${theme.accent}44`, borderRadius: 999, padding: "3px 10px", cursor: "pointer" }
          }, React.createElement(Search, { size: 12 }), "搜尋地點"),
          React.createElement("span", { style: { marginLeft: "auto", fontSize: 11, letterSpacing: 2, opacity: 0.7 } }, theme.name),
          (status === "denied" || status === "error") && React.createElement("button", { onClick: requestLocation, style: { display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: theme.accent, background: "transparent", border: `1px solid ${theme.accent}55`, borderRadius: 999, padding: "3px 8px", cursor: "pointer" } }, React.createElement(RotateCcw, { size: 11 }), " 重試")
        ),

        React.createElement("div", { className: "area-clock" },
          React.createElement("div", { className: "clock-num", style: { fontSize: sizes.clock, fontWeight: 700, lineHeight: 1.05 } }, timeStr),
          React.createElement("div", { style: { fontSize: tier === "lg" ? 15 : 13, marginTop: 4, color: theme.sub } }, dateStr, "・", weekdayStr)
