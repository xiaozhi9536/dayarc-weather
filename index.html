function SkyArc({ hour, minute, theme, h, r }) {
  const sunriseHour = 6, sunsetHour = 18;
  const isDay = hour + minute / 60 >= sunriseHour && hour + minute / 60 < sunsetHour;
  const w = 300, cx = 150, cy = h - (130 - 118);
  let progress;
  if (isDay) progress = (hour + minute / 60 - sunriseHour) / (sunsetHour - sunriseHour);
  else {
    const nightLen = 24 - (sunsetHour - sunriseHour);
    const t = (hour + minute / 60 - sunsetHour + 24) % 24;
    progress = t / nightLen;
  }
  progress = Math.min(Math.max(progress, 0), 1);
  const theta = (180 - 180 * progress) * Math.PI / 180;
  const mx = cx + r * Math.cos(theta), my = cy - r * Math.sin(theta);

  return React.createElement("svg", { width: "100%", viewBox: `0 0 ${w} ${h}`, style: { display: "block", overflow: "visible" } },

}

            ),

            React.createElement("div", {
              style: { fontFamily: "monospace", fontSize: 13, background: "#f2f4f6", padding: "8px 10px", borderRadius: 8, wordBreak: "break-all", userSelect: "all" }
            }, syncGistId),
            React.createElement("button", {

            }, "解除此裝置的同步")
          )
        : React.createElement("div", { style: { marginTop: 14 } },
            React.createElement("div", { style: { display: "flex", gap: 8, marginBottom: 14 } },
              React.createElement("button", {
                onClick: () => setMode("new"),
                style: { flex: 1, padding: "8px 0", borderRadius: 8, border: mode === "new" ? "1.5px solid #1d6fa5" : "1px solid #ddd", background: mode === "new" ? "#eaf3fa" : "#fff", color: mode === "new" ? "#1d6fa5" : "#555", cursor: "pointer", fontSize: 13, fontWeight: 600 }
              }, "建立新同步"),
              React.createElement("button", {
                onClick: () => setMode("join"),
                style: { flex: 1, padding: "8px 0", borderRadius: 8, border: mode === "join" ? "1.5px solid #1d6fa5" : "1px solid #ddd", background: mode === "join" ? "#eaf3fa" : "#fff", color: mode === "join" ? "#1d6fa5" : "#555", cursor: "pointer", fontSize: 13, fontWeight: 600 }
              }, "輸入已有同步碼")
            ),
            React.createElement("div", { style: { fontSize: 12, color: "#666", lineHeight: 1.6, marginBottom: 10 } },
              "需要一組 GitHub 個人 Token（僅需 gist 權限）。",
              React.createElement("a", { href: "https://github.com/settings/tokens/new?description=DayArc&scopes=gist", target: "_blank", rel: "noreferrer", style: { color: "#1d6fa5" } }, "點此產生"),
              "，資料會存在你自己 GitHub 帳號的私密 Gist 裡。"
            ),
            React.createElement("input", {
              type: "password", placeholder: "貼上 GitHub Token (ghp_...)", value: pat,
              onChange: (e) => setPat(e.target.value),
              className: "search-input", style: { marginTop: 0 }
            }),
            mode === "join" && React.createElement("input", {
              type: "text", placeholder: "貼上同步碼", value: gistIdInput,
              onChange: (e) => setGistIdInput(e.target.value),
              className: "search-input"
            }),
            errMsg && React.createElement("div", { style: { fontSize: 12, color: "#c0392b", marginBottom: 8 } }, errMsg),
            React.createElement("button", {
              onClick: mode === "new" ? doConnectNew : doConnectExisting,
              disabled: busy,
              style: { width: "100%", padding: "9px 12px", borderRadius: 8, border: "none", background: "#1d6fa5", color: "#fff", cursor: busy ? "default" : "pointer", fontSize: 13, fontWeight: 600, opacity: busy ? 0.6 : 1 }

/* ==========================================
 * 主組件 WeatherClock
 * ========================================== */
function WeatherClock() {
  const [now, setNow] = useState(new Date());
  const { w: vw, h: vh } = useViewport();
  const [status, setStatus] = useState("locating");
  const [place, setPlace] = useState("");
  const [coordsText, setCoordsText] = useState("");
  const [weatherData, setWeatherData] = useState({ current: null, daily: [] });
  const [aqi, setAqi] = useState(null);
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [sourceMsg, setSourceMsg] = useState("Open-Meteo");
  const [lastUpdate, setLastUpdate] = useState("");

  // 頁面輪播：0 = 天氣時鐘頁, 1 = 行事曆頁
  const [page, setPage] = useState(0);
  const [events, setEvents] = useState(() => {
    try { return JSON.parse(localStorage.getItem("dayarc_events") || "{}"); }
    catch (e) { return {}; }
  });
  const [selectedDate, setSelectedDate] = useState(null);

  useEffect(() => {
    try { localStorage.setItem("dayarc_events", JSON.stringify(events)); } catch (e) {}
  }, [events]);

  const addEvent = useCallback((dateKey, ev) => {
    setEvents((prev) => ({ ...prev, [dateKey]: [...(prev[dateKey] || []), ev] }));
  }, []);
  const deleteEvent = useCallback((dateKey, id) => {
    setEvents((prev) => ({ ...prev, [dateKey]: (prev[dateKey] || []).filter((e) => e.id !== id) }));
  }, []);

  // 跨裝置同步：把行事曆存到使用者自己的 GitHub 私密 Gist
  const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
  const [syncPAT, setSyncPAT] = useState(() => { try { return localStorage.getItem("dayarc_sync_pat") || ""; } catch (e) { return ""; } });
  const [syncGistId, setSyncGistId] = useState(() => { try { return localStorage.getItem("dayarc_sync_gist") || ""; } catch (e) { return ""; } });
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | synced | error
  const justPulled = useRef(false);
  const GIST_FILE = "dayarc-events.json";

  const pushToGist = useCallback(async (evts, pat, gistId) => {
    if (!pat || !gistId) return;
    setSyncStatus("syncing");
    try {
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: "PATCH",
        headers: { "Authorization": `token ${pat}`, "Content-Type": "application/json" },
        body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(evts, null, 2) } } })
      });
      if (!res.ok) throw new Error("push failed");
      setSyncStatus("synced");
    } catch (e) {
      setSyncStatus("error");
    }
  }, []);

  // events 有變動時，若已連接同步，就自動推送到 Gist（debounce）
  useEffect(() => {
    if (!syncGistId || !syncPAT) return;
    if (justPulled.current) { justPulled.current = false; return; }
    const t = setTimeout(() => pushToGist(events, syncPAT, syncGistId), 800);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [events]);

  const connectNewSync = useCallback(async (pat) => {
    setSyncStatus("syncing");
    try {
      const res = await fetch("https://api.github.com/gists", {
        method: "POST",
        headers: { "Authorization": `token ${pat}`, "Content-Type": "application/json" },
        body: JSON.stringify({ description: "DayArc 行事曆同步資料", public: false, files: { [GIST_FILE]: { content: JSON.stringify(events, null, 2) } } })
      });
      if (!res.ok) throw new Error("create failed");
      const data = await res.json();
      setSyncPAT(pat); setSyncGistId(data.id);
      try { localStorage.setItem("dayarc_sync_pat", pat); localStorage.setItem("dayarc_sync_gist", data.id); } catch (e) {}
      setSyncStatus("synced");
      return { ok: true };
    } catch (e) {
      setSyncStatus("error");
      return { ok: false };
    }
  }, [events]);

  const connectExistingSync = useCallback(async (pat, gistId) => {
    setSyncStatus("syncing");
    try {
      const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { "Authorization": `token ${pat}` } });
      if (!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      const file = data.files && data.files[GIST_FILE];
      const remoteEvents = file && file.content ? JSON.parse(file.content) : {};
      justPulled.current = true;
      setEvents(remoteEvents);
      setSyncPAT(pat); setSyncGistId(gistId);
      try { localStorage.setItem("dayarc_sync_pat", pat); localStorage.setItem("dayarc_sync_gist", gistId); } catch (e) {}
      setSyncStatus("synced");
      return { ok: true };
    } catch (e) {
      setSyncStatus("error");
      return { ok: false };
    }
  }, []);

  const disconnectSync = useCallback(() => {
    setSyncPAT(""); setSyncGistId("");
    try { localStorage.removeItem("dayarc_sync_pat"); localStorage.removeItem("dayarc_sync_gist"); } catch (e) {}
    setSyncStatus("idle");
  }, []);

  // 固定時間輪流切換頁面（開啟任何彈窗時暫停輪播）
  const PAGE_ROTATE_MS = 20000;
  useEffect(() => {
    if (isModalOpen || selectedDate || isSyncModalOpen) return;
    const t = setInterval(() => setPage((p) => (p === 0 ? 1 : 0)), PAGE_ROTATE_MS);
    return () => clearInterval(t);
  }, [isModalOpen, selectedDate, isSyncModalOpen]);

  // 上次成功定位的地點：從 localStorage 還原，讓「刷新後抓不到位置時退回上次定位點」在重新整理後依然有效
  const lastGoodLoc = useRef((() => {
    try {
      const saved = localStorage.getItem("dayarc_last_loc");
      return saved ? JSON.parse(saved) : null;
    } catch (e) { return null; }
  })());

  // 獨立：大時鐘每一秒更新
  useEffect(() => {
    const clockTimer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(clockTimer);
  }, []);

  const loadWeather = useCallback(async (lat, lon, customPlaceName = null) => {
    try {
      setStatus(prev => prev === "ready" ? "ready" : "locating");
      
      let geocodeData = {};
      if (!customPlaceName) {
        const gRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
        if (gRes.ok) geocodeData = await gRes.json();
      }

      const isTaiwan = customPlaceName ? customPlaceName.includes("台灣") || customPlaceName.includes("臺") || customPlaceName.includes("國中") || customPlaceName.includes("科大") : (geocodeData.countryCode === "TW");
      const finalPlaceName = customPlaceName || [geocodeData.city || geocodeData.principalSubdivision, geocodeData.locality].filter(Boolean).join(" · ");

      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`)
        .then(res => res.json()).then(data => setAqi(data.current?.us_aqi || null)).catch(() => setAqi(null));

      let finalParsedData = null;
      let finalSource = "Open-Meteo";

      const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weathercode,is_day&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);
      const wData = await wRes.json();
      const WMO_TEXT = { 0: "晴朗", 1: "晴時多雲", 2: "多雲", 3: "陰天", 45: "有霧", 48: "霧淞", 51: "毛毛雨", 61: "小雨", 63: "中雨", 65: "大雨", 71: "小雪", 80: "短暫陣雨", 81: "短暫陣雨", 82: "強陣雨", 95: "雷雨", 96: "雷雨" };
      
      finalParsedData = {
        current: {
          temp: Math.round(wData.current.temperature_2m),
          apparentTemp: Math.round(wData.current.apparent_temperature),
          rh: Math.round(wData.current.relative_humidity_2m),
          windSpeed: wData.current.wind_speed_10m,
          wxText: WMO_TEXT[wData.current.weathercode] || "未知",
          wxCode: wData.current.weathercode,
          rain: wData.daily.precipitation_probability_max[0] || 0,
          isCwa: false
        },
        daily: wData.daily.time.map((d, i) => {
          const dt = new Date(d + "T00:00:00");
          return {
            date: `${dt.getMonth()+1}/${dt.getDate()}`,
            weekday: dt.toLocaleDateString("zh-TW", { weekday: "short" }),
            wxText: WMO_TEXT[wData.daily.weathercode[i]] || "—",
            code: wData.daily.weathercode[i],
            hi: Math.round(wData.daily.temperature_2m_max[i]),
            lo: Math.round(wData.daily.temperature_2m_min[i]),
            rain: wData.daily.precipitation_probability_max[i] || 0,
            isToday: i === 0,
            isCwa: false
          };
        })
      };

      if (isTaiwan && CWA_API_KEY) {
        try {
          let cwaCity = geocodeData.city || geocodeData.principalSubdivision || (customPlaceName ? customPlaceName.split("·")[0]?.trim() : "臺北市");
          if (customPlaceName === "南台科大") cwaCity = "臺南市";
          if (customPlaceName === "桃園平鎮國中") cwaCity = "桃園市";

          const formalCity = cwaCity.replace("台", "臺"); 
          const cwaRes = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${CWA_API_KEY}&locationName=${formalCity}`);
          const cwaData = await cwaRes.json();
          
          if (cwaData.success === "true" && cwaData.records.location.length > 0) {
             const loc = cwaData.records.location[0];
             const getVal = (elName, timeIdx) => loc.weatherElement.find(e => e.elementName === elName).time[timeIdx].parameter;
             
             const currentWx = getVal("Wx", 0);
             const currentT = getVal("MinT", 0);
             const currentPoP = getVal("PoP", 0);

             finalParsedData.current.temp = currentT.parameterName;
             finalParsedData.current.apparentTemp = parseInt(currentT.parameterName) + 2; 
             finalParsedData.current.wxText = currentWx.parameterName;
             finalParsedData.current.wxCode = currentWx.parameterValue;
             finalParsedData.current.rain = currentPoP.parameterName;
             finalParsedData.current.isCwa = true;

             for(let i=0; i<3; i++) {
                 if(i >= finalParsedData.daily.length) break;
                 const dayWx = getVal("Wx", i);
                 const dayPop = getVal("PoP", i);
                 finalParsedData.daily[i].rain = dayPop.parameterName;
                 finalParsedData.daily[i].isCwa = true;
                 finalParsedData.daily[i].wxText = dayWx.parameterName;
                 finalParsedData.daily[i].code = dayWx.parameterValue;
             }

             finalSource = "CWA (即時) + Open-Meteo (一週)";
          }
        } catch (e) {
           console.warn("CWA 抓取覆寫失敗，維持全 Open-Meteo 資料", e);
        }
      }

      setCoordsText(`${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`);
      setPlace(finalPlaceName || "目前位置");
      setWeatherData(finalParsedData);
      setSourceMsg(finalSource);
      setStatus("ready");
      
      setLastUpdate(new Date().toLocaleTimeString("zh-TW", { hour12: false, hour: '2-digit', minute: '2-digit' }));
      lastGoodLoc.current = { lat, lon, name: customPlaceName || finalPlaceName || null };
      try { localStorage.setItem("dayarc_last_loc", JSON.stringify(lastGoodLoc.current)); } catch (e) {}

    } catch (e) {
      console.error("更新天氣失敗", e);
      if (lastGoodLoc.current) {
        setStatus("ready"); 
      } else {
        setStatus("error"); 
      }
    }
  }, []);

  const requestLocation = useCallback(() => {
    if (!navigator.geolocation) {
       if (lastGoodLoc.current) return loadWeather(lastGoodLoc.current.lat, lastGoodLoc.current.lon, lastGoodLoc.current.name);
       return setStatus("error");
    }
    
    setStatus(prev => prev === "ready" ? "ready" : "locating");
    
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => {
